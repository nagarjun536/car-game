<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Car Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🚗 Car Racing Game</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Score:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat">
                    <span class="label">Level:</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="controls">
            <div class="instruction">
                <h3>How to Play:</h3>
                <p>🎮 Use <strong>Arrow Keys</strong> to move your car</p>
                <p>⬆️ Up | ⬇️ Down | ⬅️ Left | ➡️ Right</p>
                <p>🚫 Avoid the red enemy cars!</p>
                <p>📍 Press <strong>Space</strong> to restart when game over</p>
            </div>
        </div>
        
        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                <h2>Game Over! 💥</h2>
                <p class="final-score">Final Score: <span id="finalScore">0</span></p>
                <p class="restart-message">Press <strong>SPACE</strong> to restart</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
